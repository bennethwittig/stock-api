<!doctype html>
<!--
  Step 4 (bonus): a tiny FRONTEND that calls YOUR backend on Render.
  1. Change API_URL below to your own Render address.
  2. Double-click this file to open it in your browser.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next-close predictor</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f4ec; color: #16243a; max-width: 560px; margin: 48px auto; padding: 0 16px; }
    input, button { font-size: 18px; padding: 10px 14px; border-radius: 8px; border: 2px solid #d5dce5; }
    button { background: #2b67a8; color: #fff; border-color: #2b67a8; cursor: pointer; }
    .card { background: #fffdf8; border-radius: 16px; padding: 24px; margin-top: 24px; }
    .big { font-size: 40px; font-weight: 700; margin: 8px 0; }
    .muted { color: #5f6b7a; }
  </style>
</head>
<body>
  <h1>Next-close predictor</h1>
  <p class="muted">This page is the frontend. It asks our API on Render, which asks Alpha Vantage.</p>

  <input id="symbol" value="TSLA" aria-label="Stock symbol">
  <button id="go">Predict</button>

  <div class="card" id="result"><span class="muted">Click Predict. The first call can take about a minute while the free server wakes up.</span></div>

  <script>
    const API_URL = "https://render-api-nalc.onrender.com";   // <-- your Render API address

    document.getElementById("go").addEventListener("click", async () => {
      const box = document.getElementById("result");
      const symbol = document.getElementById("symbol").value.trim().toUpperCase();
      box.textContent = "Asking the API...";
      try {
        const res = await fetch(`${API_URL}/predict/live?symbol=${encodeURIComponent(symbol)}`);
        const data = await res.json();
        if (!res.ok) {
          box.textContent = `Error ${res.status}: ${JSON.stringify(data.detail)}`;
          return;
        }
        box.innerHTML = `
          <div class="muted">${data.symbol}, latest trading day ${data.latest_trading_day}</div>
          <div>Last close: <b>${data.last_close}</b> · Previous close: ${data.previous_close}</div>
          <div class="big">${data.predicted_next_close}</div>
          <div class="muted">Predicted next close (naive guess: ${data.naive_forecast})</div>`;
      } catch (err) {
        box.textContent = "Could not reach the API. Check API_URL, or wait for the server to wake up and try again.";
      }
    });
  </script>
</body>
</html>
